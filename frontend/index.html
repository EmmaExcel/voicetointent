<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to Intent</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Voice to Intent</h1>
            <p>Speak a financial command to extract structured data.</p>
        </header>

        <main>
            <div class="recorder-section">
                <button id="record-btn" class="record-btn">
                    <span class="btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                    </span>
                    <span class="btn-text">Hold to Speak</span>
                </button>
                <div id="status-indicator" class="status-indicator">Ready</div>
            </div>

            <div class="results-section">
                <div class="panel transcript-panel">
                    <h3>Transcript</h3>
                    <div id="transcript-box" class="content-box text-content">Waiting for audio...</div>
                    <div id="confidence-bar" class="confidence-bar-container" style="display: none;">
                        <div class="confidence-fill"></div>
                        <span class="confidence-text">0%</span>
                    </div>
                </div>

                <div class="panel intent-panel">
                    <h3>Extracted Intent</h3>
                    <pre id="intent-box" class="content-box code-content">{}</pre>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
